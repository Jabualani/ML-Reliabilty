[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-reliability"
version = "0.1.0"
description = "Tools for assessing machine-learning reliability alongside predictions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jabulani Monchwe" }]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
joblib = ["joblib>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
